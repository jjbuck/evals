<svg xmlns="http://www.w3.org/2000/svg" id="svg-loop" viewBox="0 0 1000 698" width="100%" role="img" aria-labelledby="svg-loop-title svg-loop-desc">
<title id="svg-loop-title">The optimization loop</title>
<desc id="svg-loop-desc">One iteration of a study. 1, the agent: a @tunable factory whose tunable arguments are Python objects: TextValue and tool_descriptions(...) for text, Int, Float and Choice for numbers, OneOf and Switch for a choice between components, SkillLibrary for skills; plain arguments stay fixed. 2, search: the schedule picks which blocks change this iteration; each changing block's method proposes values for its variables (TPE from Optuna for numbers and choices, contrastive reflection for text, skill curation for skill libraries) and every other variable is held at the incumbent, the best candidate so far. 3, the proposed values are a candidate: the factory builds a fresh agent for every trial, the Strands Evals Experiment runs every case and repetition, and its evaluators score each trial; each trial has a status (completed, agent_failure, infrastructure_invalid, verifier_invalid), never a silent zero, and usage is measured (tokens, seconds, model calls). 4, projection: repetitions are averaged within a case, and each metric gets a mean and 95% interval over cases; objectives combine as Pareto, WeightedSum, Chebyshev, Lexicographic or Independent, and constraints (AtMost, AtLeast) limit any metric or a Derived one. 5, feedback: TPE is told the objective values and constraint violations; reflection reads the held candidate's trials, their rewards and transcripts; the incumbent and best set are updated; values already measured are never measured again. 6, every candidate is appended to the record (study.jsonl and transcripts), which the explorer reads.</desc>
