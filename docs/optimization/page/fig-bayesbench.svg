<svg xmlns="http://www.w3.org/2000/svg" id="svg-bayesbench" viewBox="0 0 1000 492" width="100%" role="img" aria-labelledby="svg-bayesbench-title svg-bayesbench-desc">
<title id="svg-bayesbench-title">Where BayesBench fits</title>
<desc id="svg-bayesbench-desc">Two Bayesian pieces, in different places. Inside the loop, TPE (Optuna's tree-structured Parzen estimator) is a block's method: from the candidates measured so far it models where good and poor values of its block's numbers and choices lie, here window_size, and proposes the next values; each result is told back to it. It answers what to try next. Outside the loop, after a run, BayesBench reads the record (study.jsonl) and fits a conjugate Gaussian posterior over the main effects and pairwise interactions of every option and setting, and the case, on each goal, from every candidate's per-case means, each with its own noise; it writes effects.json. The explorer shows each option's change from its reference with a 90% credible interval, for example on the answer metric of a document-reader study: summarizing vs sliding_window +0.74, summary_ratio 0.428 to 0.768 +0.11, two system-prompt rewrites +0.04 and preserve_recent 4 to 7 -0.02, the last two with intervals that include zero; it flags the fit when the model misses held-out observations. It answers which choice helps, by how much, and how surely. A dashed path marks later work, not built yet: the same posterior inside the loop as a method for categorical blocks, choosing by Thompson sampling.</desc>
