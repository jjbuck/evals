<svg xmlns="http://www.w3.org/2000/svg" id="svg-blocks" viewBox="0 0 1000 627" width="100%" role="img" aria-labelledby="svg-blocks-title svg-blocks-desc">
<title id="svg-blocks-title">Blocks and schedules</title>
<desc id="svg-blocks-desc">Left: the document-reader agent's variables in three blocks. choose_manager = Block(TPE(), manager) holds the OneOf choice between two components, sliding_window (SlidingWindowConversationManager) and summarizing (SummarizingConversationManager). tune_manager = Block(TPE(), window_size, pin_first, summary_ratio, preserve_recent) holds the managers' settings: window_size and pin_first exist only under sliding_window, summary_ratio and preserve_recent only under summarizing. rewrite_texts = Block(Reflection(), system_prompt, tools) holds the system prompt and one TextValue per tool description (open_document, read_page). Right: three schedules over ten iterations, one column per iteration and a square where a block changes. Joint(): every block changes in every iteration. Alternate(tune_manager, rewrite_texts): tune_manager in odd iterations, rewrite_texts in even ones; choose_manager is not named and stays at the incumbent. Nested(outer=choose_manager, inner=Joint(), inner_iterations=4): two rounds of five iterations; each opens with a manager proposal (iterations 1 and 6), then four iterations change rewrite_texts and tune_manager together under that manager, and the round's best result is told back to the manager's TPE. Each iteration moves some blocks and holds the rest at the incumbent.</desc>
